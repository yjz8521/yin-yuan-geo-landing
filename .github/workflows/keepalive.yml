# Keeps scheduled workflows alive: GitHub disables cron workflows in public repos
# after 60 days without repository activity. Re-enabling via the API resets that
# timer without needing dummy commits. Runs weekly (Mon 01:17 UTC).
name: workflow-keepalive
on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch: {}
permissions:
  actions: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for wf in geo-tick.yml keepalive.yml; do
            gh api -X PUT "repos/${REPO}/actions/workflows/${wf}/enable" && echo "enabled ${wf}"
          done
