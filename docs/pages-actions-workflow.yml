# Copy to .github/workflows/pages.yml once a token with `workflow` scope is available.
# Overnight deploy used the gh-pages branch instead (see OVERNIGHT.md).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build static export
        env:
          NEXT_PUBLIC_SITE_URL: https://yjz8521.github.io/yin-yuan-geo-landing
          NEXT_PUBLIC_APP_URL: ""
          NEXT_PUBLIC_STRIPE_PAYMENT_LINK: "#"
          NEXT_PUBLIC_DEMO_EMAIL: yjz8521@gmail.com
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
